# The HTTP/WebSocket server. Reachable only through this ClusterIP
# Service (kubectl port-forward svc/api 18080:8080).
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector: {app: api}
  ports: [{name: http, port: 8080, targetPort: 8080}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1
  selector: {matchLabels: {app: api}}
  template:
    metadata: {labels: {app: api}}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: api
          # Built locally and loaded with `kind load`; never pulled.
          image: callit-backend:local
          imagePullPolicy: Never
          command: ["/app/api"]
          envFrom: [{configMapRef: {name: callit-config}}]
          env:
            - {name: JWT_SECRET_FILE, value: /run/secrets/jwt_secret}
          ports: [{containerPort: 8080}]
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
            periodSeconds: 5
          # As in compose.prod.yml: no capabilities, no privilege
          # escalation, read-only root filesystem.
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            # distroless's nonroot; the image names its user, and the kubelet
            # can only verify runAsNonRoot against a numeric UID.
            runAsUser: 65532
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: secrets, mountPath: /run/secrets, readOnly: true}
      volumes:
        - name: secrets
          secret:
            secretName: callit-secrets
            items: [{key: jwt_secret, path: jwt_secret}]
