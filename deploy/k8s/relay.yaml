# Redis wager-outbox stream -> Kafka. At most one relay pod may ever
# exist: on startup it claims every pending outbox entry, which would take
# a still-running relay's in-flight batch and could let a rounds_settled
# overtake the wagers it settles (plan 8a.2, Decision 3). That's why this
# is a one-replica StatefulSet, not a Deployment. A Deployment starts its
# replacement while the old pod is still terminating (on a pod delete,
# eviction or node drain, whatever its strategy); a StatefulSet waits for
# relay-0 to be gone before creating it again. Never scale this up.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: relay
spec:
  # Required by the API; no Service is needed, the relay accepts no traffic.
  serviceName: relay
  replicas: 1
  selector: {matchLabels: {app: relay}}
  template:
    metadata: {labels: {app: relay}}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: relay
          image: callit-backend:local
          imagePullPolicy: Never
          command: ["/app/relay"]
          envFrom: [{configMapRef: {name: callit-config}}]
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            # distroless's nonroot; the image names its user, and the kubelet
            # can only verify runAsNonRoot against a numeric UID.
            runAsUser: 65532
            capabilities: {drop: [ALL]}
