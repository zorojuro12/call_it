# Redis wager-outbox stream -> Kafka. Exactly one, replaced with Recreate:
# on startup it claims every pending outbox entry, which is only safe if
# no other relay is alive (plan 8a.2, Decision 3). A RollingUpdate would
# briefly run two, and the new one would take the old one's in-flight
# batch. Never scale this up.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: relay
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector: {matchLabels: {app: relay}}
  template:
    metadata: {labels: {app: relay}}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: relay
          image: callit-backend:local
          imagePullPolicy: Never
          command: ["/app/relay"]
          envFrom: [{configMapRef: {name: callit-config}}]
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            # distroless's nonroot; the image names its user, and the kubelet
            # can only verify runAsNonRoot against a numeric UID.
            runAsUser: 65532
            capabilities: {drop: [ALL]}
