name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: callit
          POSTGRES_PASSWORD: callit
          POSTGRES_DB: callit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U callit"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Vet
        run: go vet ./...

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: Build
        run: go build ./...

      # Kafka runs via the same docker-compose.yml as local dev (the
      # `full` profile) rather than a services: container — KRaft mode's
      # listener configuration is awkward to express as a GitHub Actions
      # service, and reusing the compose file keeps CI and local dev on
      # one definition.
      - name: Start Kafka
        working-directory: .
        run: |
          docker compose --profile full up -d kafka
          until [ "$(docker inspect -f '{{.State.Health.Status}}' call-it-kafka-1 2>/dev/null)" = "healthy" ]; do
            sleep 2
          done

      - name: Test
        run: go test ./... -race -cover -p 1
        env:
          REDIS_ADDR: localhost:6379
          POSTGRES_DSN: postgres://callit:callit@localhost:5432/callit?sslmode=disable
          KAFKA_BROKERS: localhost:9092

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8080

  frontend-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Start Redis
        run: docker compose up -d redis

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: E2E
        working-directory: frontend
        run: npx playwright test
        env:
          REDIS_ADDR: localhost:6379
